[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=7", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dts"
description = "Frequency-domain divide-and-conquer MCMC for stationary time series"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
authors = [
    {name = "Feng Li", email = "feng.li@cufe.edu.cn"},
    {name = "Zixuan Wang", email = "zixuan.wang-2@student.uts.edu.au"},
    {name = "Matias Quiroz", email = "quiroz.matias@gmail.com"},
]
license = {text = "MIT"}
keywords = ["Spark", "MCMC", "Whittle likelihood", "distributed time series"]
dependencies = [
    "autograd>=1.8.0",
    "matplotlib>=3.6.0",
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]

[project.urls]
Repository = "https://github.com/feng-li/dts"

[tool.setuptools.packages.find]
include = ["dts*"]

[tool.setuptools_scm]
version_scheme = "release-branch-semver"
write_to = "dts/_version.py"
fallback_version = "0.1.0"
